<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | Rapid Rafting Adventures</title>
  <meta name="description"
    content="Contact Rapid Rafting Adventures for inquiries, reservations, or website suggestions. Find our address, phone number, and location map here.">
  <meta name="author" content="Your Full Name">
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

  <header>
    <img src="images/logo.png" alt="Rapid Rafting Adventures Logo">
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="trips.html">Trips</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>White Water Rafting Company</h1>
    
    <section class="contact-info">
      <p>123 Main River Street</p>
      <p>Kolob, California</p>
      <p>+1 999 999 9999</p>
      <p>info@whitewater.com</p>
    </section>

    <section class="contact-layout">
      <!-- Embedded Google Map -->
      <div class="map-container">
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.086283686852!2d-122.4194155846811!3d37.77492977975942!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808f7e2d6a4a4a4b%3A0x1a2b3c4d5e6f7g8h!2sSan%20Francisco%2C%20CA!5e0!3m2!1sen!2sus!4v1620000000000!5m2!1sen!2sus" 
          width="100%" 
          height="300" 
          allowfullscreen="" 
          loading="lazy">
        </iframe>
      </div>

      <!-- Contact Form -->
      <form action="#" method="post" class="contact-form">
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" placeholder="Placeholder" required>
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="Placeholder" required>
        </div>

        <fieldset class="form-group">
          <legend>Message Purpose</legend>
          <label>
            <input type="radio" name="purpose" value="general" checked> General Inquiry
          </label>
          <label>
            <input type="radio" name="purpose" value="reservation"> Reservation Question
          </label>
          <label>
            <input type="radio" name="purpose" value="suggestion"> Website Suggestion
          </label>
        </fieldset>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" placeholder="Type here"></textarea>
        </div>

        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" id="subscribe" name="subscribe"> Please Subscribe me to the monthly newsletter
          </label>
        </div>

        <button type="submit" class="submit-btn">Get in Touch!</button>
      </form>
    </section>

    <!-- Employee Profiles -->
    <section class="employees">
      <h2>We Are Here to Serve You</h2>
      <div class="employee-grid">
        <figure>
          <img src="images/employee1.jpg" alt="Employee Profile">
          <figcaption>Employee Profile</figcaption>
        </figure>
        <figure>
          <img src="images/employee2.jpg" alt="Employee Profile">
          <figcaption>Employee Profile</figcaption>
        </figure>
        <figure>
          <img src="images/employee3.jpg" alt="Employee Profile">
          <figcaption>Employee Profile</figcaption>
        </figure>
      </div>
    </section>

  </main>

  <footer>
    <p>© 2026 Rapid Rafting Adventures | Your Full Name</p>
    <nav class="socialmedia">
      <a href="#">
        <img src="images/facebook.png" alt="Facebook Icon">
      </a>
      <a href="#">
        <img src="images/linkedin.png" alt="LinkedIn Icon">
      </a>
      <a href="#">
        <img src="images/instagram.png" alt="Instagram Icon">
      </a>
    </nav>
  </footer>

</body>

</html>
